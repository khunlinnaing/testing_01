name: Automated Code Review

# PR တင်တဲ့အခါတိုင်း ဒါမှမဟုတ် Main Branch ကို Push လုပ်တဲ့အခါတိုင်း Run မယ်
on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  review:
    name: Lint and Static Analysis
    runs-on: ubuntu-latest

    steps:
      # ၁။ Code ကို GitHub Runner ပေါ်ဆွဲတင်ခြင်း
      - name: Checkout Code
        uses: actions/checkout@v4

      # ၂။ Node.js Environment ပြင်ဆင်ခြင်း
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: '20'
          cache: 'npm'

      # ၃။ လိုအပ်တဲ့ Dependency များ Run ခြင်း
      - name: Install Dependencies
        run: npm ci

      # ၄။ Linter ဖြင့် ကုဒ်စစ်ဆေးခြင်း
      - name: Run Linter (ESLint)
        run: npm run lint

      # ၅။ (Optional) Unit Test များ စစ်ဆေးခြင်း
      - name: Run Tests
        run: npm test
